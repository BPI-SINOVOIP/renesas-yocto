#@TYPE: Machine
#@NAME: bananapi-ai2h machine
#@DESCRIPTION: RZ/V2H Development Board platform

require conf/machine/include/arm/armv8-2a/tune-cortexa55.inc
require conf/machine/include/rz-common.inc
require conf/machine/include/rzv2h-family.inc
require conf/machine/include/bananapi-common.inc

SERIAL_CONSOLES ?= "115200;ttySC0"
PREFERRED_VERSION_trusted-firmware-a ?= "2.10%"
TFA_PLATFORM ?= "v2h"
TFA_BOARD ?= "evk_1"
TFA_UBOOT ?= "1"
TFA_BUILD_TARGET ?= "bl2 fip"
BL2_BOOT_TARGET ?= "spi mmc esd"
EXTRA_IMAGEDEPENDS += " firmware-pack"
MACHINE_EXTRA_RDEPENDS += " isp-modules-load video-hw-udev-rules"

BL2_BASE_ADDR ?= "0x08103000"
BL2_ADJUST_VMA ?= "0x08101E00"
FIP_ADJUST_VMA ?= "0x0"

UBOOT_CONFIG ??= "bananapi-ai2h"
UBOOT_CONFIG[bananapi-ai2h] = "bananapi_ai2h_defconfig"
PREFERRED_VERSION_u-boot ?= "2024.07%"

# flash writer
EXTRA_IMAGEDEPENDS += " flash-writer"

# firmware pack
EXTRA_IMAGEDEPENDS += " firmware-pack"

# Supported devicetree
KERNEL_DTBDEST ?= "${KERNEL_IMAGEDEST}/dtb/renesas"
KERNEL_DEVICETREE = " \
    renesas/bananapi-ai2h.dtb \
"

IMAGE_BOOT_FILES = " \
	bl2_bp_spi-${MACHINE}.bin \
	bl2_bp_spi-${MACHINE}.srec \
	bl2_bp_mmc-${MACHINE}.bin \
	bl2_bp_mmc-${MACHINE}.srec \
	fip-${MACHINE}.bin \
	fip-${MACHINE}.srec \
	Flash_Writer_SCIF_RZV2H_DEV_INTERNAL_MEMORY.mot \
"

# Wic image
WKS_FILE = "bananapi-rz-image-esd.wks"
do_image_wic[depends] += "firmware-pack:do_deploy"
